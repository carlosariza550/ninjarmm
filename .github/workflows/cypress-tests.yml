name: Run Cypress Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Cache Cypress binary
      uses: actions/cache@v3
      with:
        path: ~/.cache/Cypress
        key: cypress-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          cypress-cache-${{ runner.os }}-

    - name: Install dependencies
      run: npm install

    - name: Install Cypress binary
      run: npx cypress install

    - name: Check runner version
      run: "echo Runner version: ${{ runner.os }} ${{ runner.arch }}"

    - name: Run Cypress tests
      run: npx cypress run --reporter mocha-junit-reporter --reporter-options mochaFile=results/test-results.xml

    - name: Cache test results
      uses: actions/cache@v3
      with:
        path: results/test-results.xml
        key: cypress-test-results-${{ github.run_id }}
